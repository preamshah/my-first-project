<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMISSION</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #dcf0fa;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #123b3b;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
    }
    input[type="text"], input[type="email"], select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input[type="submit"] {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      padding: 14px 20px;
      margin: 8px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #45a049;
    }

    input[type="submit"]:hover {
        background-color: red;
    }

    .bottom-footer{
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    }

  </style>
</head>
<body>

<div class="container">
  <h2>Admission Form</h2>
  <form action="#" method="post" onsubmit="return validateForm()">
    <label for="fullName">Full Name:</label>
    <input type="text" id="fullName" name="fullName" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="phoneNumber">Phone Number:</label>
    <input type="text" id="phoneNumber" name="phoneNumber" pattern="[0-9]{10}" title="Please enter a 10-digit phone number" required>

    <label for="course">Select Course:</label>
    <select id="course" name="course" required>
      <option value="">-- Select --</option>
      <option value="Computer Engineering">Computer Engineering</option>
      <option value="Architecture Engineering">Architecture Engineering</option>
      <option value="Mechanical Engineering">Mechanical Engineering</option>
      <option value="Civil Engineering">Civil Engineering</option>
      <option value="Lab Assitance">Lab Assitance</option>
      <option value="Health Assitance">Health Assitance</option>
    </select>

    <input type="submit" value="Submit">
  </form>
</div>

<div class="bottom-footer">
  <p>Copyright &copy; 2024 GPC | Desigined by <a href="index.html" style="text-decoration: none;">Pream Shah</a></p>
</div>

<script>
  function validateForm() {
    var phoneNumber = document.getElementById("phoneNumber").value;
    if (!(/^\d{10}$/.test(phoneNumber))) {
      alert("Please enter a valid 10-digit phone number");
      return false;
    }
    return true;
  }
</script>

</body>
</html>
